<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>

<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C2C2A">How Docker Works</text>

<defs>
<marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Registry -->
<rect x="380" y="38" width="130" height="56" rx="10" fill="#CFEDE4" stroke="#0F6E56" stroke-width="1"/>
<path transform="translate(402,60) scale(0.85)" d="M -8,4 A4,4 0 0 1 -6,-3.5 A5,5 0 0 1 4,-4.5 A4,4 0 0 1 8,4 Z" fill="none" stroke="#0F6E56" stroke-width="1.3"/>
<text x="420" y="64" font-size="13" font-weight="bold" fill="#0F6E56">Registry</text>
<text x="445" y="86" text-anchor="middle" font-size="10" fill="#0F6E56">Docker Hub</text>

<!-- Your machine container -->
<rect x="25" y="180" width="615" height="215" rx="14" fill="#F5F5F3" stroke="#B9B8B2" stroke-width="1"/>
<text x="45" y="200" font-size="12" font-weight="bold" fill="#5F5E5A">Your machine</text>

<!-- Dockerfile -->
<rect x="40" y="215" width="120" height="55" rx="10" fill="#E7E6E2" stroke="#5F5E5A" stroke-width="1"/>
<g transform="translate(62,236) scale(0.85)" stroke="#5F5E5A" stroke-width="1.3" fill="none">
<rect x="-6" y="-8" width="12" height="16" rx="1.5"/>
<line x1="-3.5" y1="-3" x2="3.5" y2="-3"/>
<line x1="-3.5" y1="0.5" x2="3.5" y2="0.5"/>
<line x1="-3.5" y1="4" x2="1" y2="4"/>
</g>
<text x="80" y="240" font-size="13" font-weight="bold" fill="#2C2C2A">Dockerfile</text>
<text x="100" y="262" text-anchor="middle" font-size="10" fill="#5F5E5A">Build instructions</text>

<!-- Docker engine -->
<rect x="205" y="215" width="140" height="55" rx="10" fill="#D6E6F7" stroke="#185FA5" stroke-width="1"/>
<g transform="translate(227,236) scale(0.85)" fill="none">
<line x1="5.5" y1="0" x2="8.5" y2="0" stroke="#134679" stroke-width="1.6"/>
<line x1="2.75" y1="4.76" x2="4.25" y2="7.36" stroke="#134679" stroke-width="1.6"/>
<line x1="-2.75" y1="4.76" x2="-4.25" y2="7.36" stroke="#134679" stroke-width="1.6"/>
<line x1="-5.5" y1="0" x2="-8.5" y2="0" stroke="#134679" stroke-width="1.6"/>
<line x1="-2.75" y1="-4.76" x2="-4.25" y2="-7.36" stroke="#134679" stroke-width="1.6"/>
<line x1="2.75" y1="-4.76" x2="4.25" y2="-7.36" stroke="#134679" stroke-width="1.6"/>
<circle cx="0" cy="0" r="5" stroke="#134679" stroke-width="1.3"/>
<circle cx="0" cy="0" r="1.6" fill="#134679"/>
</g>
<text x="245" y="240" font-size="13" font-weight="bold" fill="#134679">Docker engine</text>
<text x="275" y="262" text-anchor="middle" font-size="10" fill="#134679">Builds &amp; runs</text>

<!-- Image -->
<rect x="385" y="215" width="105" height="55" rx="10" fill="#FBE4BE" stroke="#C97B1E" stroke-width="1"/>
<g transform="translate(407,236) scale(0.75)" fill="none" stroke="#8A5410" stroke-width="1.3">
<rect x="-7" y="1" width="14" height="7" rx="1.5"/>
<rect x="-5.5" y="-3" width="14" height="7" rx="1.5"/>
<rect x="-4" y="-7" width="14" height="7" rx="1.5"/>
</g>
<text x="422" y="240" font-size="13" font-weight="bold" fill="#8A5410">Image</text>
<text x="437" y="262" text-anchor="middle" font-size="10" fill="#8A5410">Read-only template</text>

<!-- Container -->
<rect x="515" y="215" width="105" height="55" rx="10" fill="#F7D9D3" stroke="#C0432E" stroke-width="1"/>
<g transform="translate(537,236) scale(0.75)" fill="none" stroke="#8A2E1D" stroke-width="1.3">
<path d="M -7,-3 L 0,-7 L 7,-3 L 0,1 Z"/>
<path d="M -7,-3 L -7,4 L 0,8 L 0,1 Z"/>
<path d="M 7,-3 L 7,4 L 0,8 L 0,1 Z"/>
</g>
<text x="552" y="240" font-size="13" font-weight="bold" fill="#8A2E1D">Container</text>
<text x="567" y="262" text-anchor="middle" font-size="10" fill="#8A2E1D">Running instance</text>

<!-- Host OS -->
<rect x="515" y="335" width="105" height="55" rx="10" fill="#E7E6E2" stroke="#5F5E5A" stroke-width="1"/>
<g transform="translate(537,356) scale(0.75)" fill="none" stroke="#5F5E5A" stroke-width="1.3">
<rect x="-8" y="-7" width="16" height="6" rx="1.2"/>
<rect x="-8" y="1" width="16" height="6" rx="1.2"/>
<circle cx="-5" cy="-4" r="0.9" fill="#5F5E5A" stroke="none"/>
<circle cx="-5" cy="4" r="0.9" fill="#5F5E5A" stroke="none"/>
</g>
<text x="552" y="360" font-size="13" font-weight="bold" fill="#2C2C2A">Host OS</text>
<text x="567" y="382" text-anchor="middle" font-size="10" fill="#2C2C2A">Shared kernel</text>

<!-- Arrows -->
<path d="M160,242 L205,242" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrowGray)"/>
<text x="182" y="230" text-anchor="middle" font-size="10" fill="#5F5E5A">build</text>

<path d="M345,242 L385,242" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrowGray)"/>
<text x="365" y="230" text-anchor="middle" font-size="10" fill="#5F5E5A">creates</text>

<path d="M425,215 L425,94" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrowBlue)"/>
<text x="393" y="155" text-anchor="middle" font-size="10" fill="#185FA5">push</text>

<path d="M465,94 L465,215" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrowTeal)"/>
<text x="497" y="155" text-anchor="middle" font-size="10" fill="#0F6E56">pull</text>

<path d="M490,242 L515,242" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrowGray)"/>
<text x="502" y="230" text-anchor="middle" font-size="10" fill="#5F5E5A">run</text>

<path d="M567,270 L567,335" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrowGray)"/>
<text x="567" y="303" text-anchor="middle" font-size="10" fill="#5F5E5A">uses</text>

<!-- Animated flow dots (native SVG/SMIL animation - plays in browsers and GitHub's README preview) -->
<circle r="4.2" fill="#5F5E5A">
  <animate attributeName="cx" values="160;205;160" dur="1.6s" begin="0s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="linear"/>
  <animate attributeName="cy" values="242;242;242" dur="1.6s" begin="0s" repeatCount="indefinite"/>
</circle>

<circle r="4.2" fill="#5F5E5A">
  <animate attributeName="cx" values="345;385;345" dur="1.6s" begin="-0.24s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="linear"/>
  <animate attributeName="cy" values="242;242;242" dur="1.6s" begin="-0.24s" repeatCount="indefinite"/>
</circle>

<circle r="4.2" fill="#185FA5">
  <animate attributeName="cx" values="425;425;425" dur="1.6s" begin="-0.48s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="215;94;215" dur="1.6s" begin="-0.48s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="linear"/>
</circle>

<circle r="4.2" fill="#0F6E56">
  <animate attributeName="cx" values="465;465;465" dur="1.6s" begin="-0.72s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="94;215;94" dur="1.6s" begin="-0.72s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="linear"/>
</circle>

<circle r="4.2" fill="#5F5E5A">
  <animate attributeName="cx" values="490;515;490" dur="1.6s" begin="-0.96s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="linear"/>
  <animate attributeName="cy" values="242;242;242" dur="1.6s" begin="-0.96s" repeatCount="indefinite"/>
</circle>

<circle r="4.2" fill="#5F5E5A">
  <animate attributeName="cx" values="567;567;567" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="270;335;270" dur="1.6s" begin="-1.2s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="linear"/>
</circle>

</svg>
